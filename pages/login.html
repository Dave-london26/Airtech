<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Login | AeroTech</title>

    <link
        rel="stylesheet"
        href="../css/style.css"
    >

</head>


<body class="auth-page">

    <div class="auth-container glass">

        <a
            href="../index.html"
            class="brand"
        >

            <span class="logo">
                A
            </span>

            AeroTech

        </a>


        <h1>
            Welcome Back
        </h1>

        <p>
            Login to your AeroTech customer account.
        </p>


        <form id="loginForm">

            <label>

                Email or Phone

                <input
                    type="text"
                    name="identity"
                    placeholder="Email or phone"
                    required
                >

            </label>


            <label>

                Password

                <input
                    type="password"
                    name="password"
                    placeholder="Your password"
                    required
                >

            </label>


            <button
                type="submit"
                class="btn"
            >
                Login
            </button>

        </form>


        <p class="muted">

            Don't have an account?

            <a href="signup.html">
                Sign Up
            </a>

        </p>


        <p
            id="formMessage"
            class="message"
        ></p>

    </div>


    <script src="../js/auth.js"></script>

</body>

</html>
